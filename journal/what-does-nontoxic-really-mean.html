    <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What does nontoxic mean on a mattress?","acceptedAnswer":{"@type":"Answer","text":"Nontoxic is a consumer shorthand, not a regulated standard. It usually describes a product designed to reduce exposure to materials a shopper prefers to avoid. Because no single body defines the word, the useful step is to look underneath it: what the product is made from, whether the materials are disclosed, what flame barrier it uses, whether it contains fiberglass, and whether emissions are independently tested."}},{"@type":"Question","name":"What is the difference between an organic mattress and a natural mattress?","acceptedAnswer":{"@type":"Answer","text":"Natural generally describes where a material came from, such as latex tapped from a rubber tree or wool from a sheep. Organic refers to how a fiber or material was farmed and processed, and it carries weight only when an applicable independent certification such as GOTS or GOLS verifies it. A mattress can be largely natural without being certified organic."}},{"@type":"Question","name":"Does made with organic materials mean the whole mattress is certified organic?","acceptedAnswer":{"@type":"Answer","text":"No. Made with organic materials means one or more components, often the cotton cover or the wool layer, are organic. Certified organic means an independent certification verifies specific requirements for the material, product, facility, or process. Always ask what the certificate covers and what it does not."}},{"@type":"Question","name":"How do I find out whether a mattress contains fiberglass?","acceptedAnswer":{"@type":"Answer","text":"Ask the retailer or manufacturer in writing what the flame barrier is made from, and ask for that answer to come from manufacturer documentation rather than a sales description. If nobody can name the barrier material, treat that as the answer to a different
