    <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is nervous system overload?","acceptedAnswer":{"@type":"Answer","text":"Nervous system overload is what happens when the body stays in a low-grade state of activation for too long, too many inputs, too little recovery. The result is often a feeling of being exhausted but unable to rest, sometimes called 'tired but wired.' It is not a character flaw; it is a physiological response to chronic stimulation."}},{"@type":"Question","name":"How does my home environment affect my nervous system?","acceptedAnswer":{"@type":"Answer","text":"Your surroundings are always communicating with your body. Harsh lighting, clutter, noise, poor support, and constant stimulation keep the nervous system on alert. Soft textures, supportive sleep systems, natural materials, calming palettes, and intentional lighting help the body shift into rest. A well-designed home is one of the most powerful tools for restoration."}},{"@type":"Question","name":"Why does Harmony Home focus on more than mattresses?","acceptedAnswer":{"@type":"Answer","text":"Because sleep does not exist in isolation. A great mattress in a chaotic room cannot do its full work. We curate complete environments, sleep systems, furniture, textures, and lighting, designed to help the body exhale. Luxury, to us, is waking up restored."}}]}</script>
