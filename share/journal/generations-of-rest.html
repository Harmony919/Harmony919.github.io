    <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Why is rest such a meaningful theme on Mother's Day?","acceptedAnswer":{"@type":"Answer","text":"Because it is often the first thing a mother gives away and the last thing she keeps for herself. To honor a mother is, in part, to notice that quiet exchange, and to make a little room for her to set things down."}},{"@type":"Question","name":"How do you honor a grandmother on Mother's Day?","acceptedAnswer":{"@type":"Answer","text":"Sit beside her. Listen to the stories she has told before, as if you have never heard them. Let her be the one who does not get up to refill anything. Honor, in her case, often looks like simply staying still."}},{"@type":"Question","name":"What does it mean to inherit rest?","acceptedAnswer":{"@type":"Answer","text":"It means watching the women before you choose stillness on purpose, and learning, slowly, that you are allowed to do the same. It is the kind of inheritance that does not appear in any will, but quietly shapes a life."}}]}</script>
