    <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is compassion fatigue?","acceptedAnswer":{"@type":"Answer","text":"Compassion fatigue is the emotional exhaustion that builds up when someone gives care to others over long periods without adequate recovery. It does not mean a caregiver has stopped caring. Often, it means they have cared deeply for a long time without enough rest, support, or replenishment."}},{"@type":"Question","name":"Why does sleep matter so much for nurses and caregivers?","acceptedAnswer":{"@type":"Answer","text":"Sleep is not only physical recovery. It regulates emotion, stabilizes the nervous system, sharpens decision making, and rebuilds the patience and presence that caregiving requires. Well rested caregivers are simply more capable of giving the kind of compassionate, attentive care their patients and loved ones need."}},{"@type":"Question","name":"What are simple ways to restore your nervous system at home?","acceptedAnswer":{"@type":"Answer","text":"Protect the sleep environment with calm light, breathable bedding, and a supportive mattress. Create a wind down rhythm that puts screens away before bed. Build small pockets of stillness into the day, a quiet walk, a slow morning, a few minutes on the porch. And ask for help long before exhaustion forces the issue."}}]}</script>
